name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];\
print(next(x['udid'] for r in sorted(d, reverse=True) for x in d[r] \
if 'iPhone' in x['name'] and x['isAvailable']))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project SkyFare.xcodeproj \
            -scheme SkyFare \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:SkyFareTests \
            -enableCodeCoverage YES \
            -resultBundlePath UnitTests.xcresult

      - name: UI tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project SkyFare.xcodeproj \
            -scheme SkyFare \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:SkyFareUITests \
            -skip-testing:SkyFareUITests/ScreenshotUITests \
            -resultBundlePath UITests.xcresult

      - name: Coverage summary
        if: always()
        run: |
          if [ -d UnitTests.xcresult ]; then
            xcrun xccov view --report --only-targets UnitTests.xcresult
          fi

      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: |
            UnitTests.xcresult
            UITests.xcresult
          retention-days: 5
