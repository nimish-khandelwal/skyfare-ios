name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -E "iPhone" \
            | tail -1 \
            | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project SkyFare.xcodeproj \
            -scheme SkyFare \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -only-testing:SkyFareTests \
            -only-testing:SkyFareUITests \
            -skip-testing:SkyFareUITests/ScreenshotUITests \
            -enableCodeCoverage YES \
            -resultBundlePath Tests.xcresult

      - name: Coverage summary
        if: always()
        run: |
          if [ -d Tests.xcresult ]; then
            xcrun xccov view --report --only-targets Tests.xcresult
          fi

      - name: Upload result bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: Tests.xcresult
          retention-days: 5
