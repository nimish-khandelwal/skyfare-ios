name: SkyFare
options:
  bundleIdPrefix: com.nimishkhandelwal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

configs:
  Debug: debug
  Release: release

targets:
  SkyFare:
    type: application
    platform: iOS
    sources:
      - path: SkyFare
        excludes:
          - "**/.DS_Store"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nimishkhandelwal.skyfare
        PRODUCT_NAME: SkyFare
        INFOPLIST_FILE: SkyFare/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES

  SkyFareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SkyFareTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SkyFare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nimishkhandelwal.skyfare.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SkyFare.app/SkyFare"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SkyFareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SkyFareUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: SkyFare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nimishkhandelwal.skyfare.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SkyFare

schemes:
  SkyFare:
    build:
      targets:
        SkyFare: all
        SkyFareTests: [test]
        SkyFareUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - SkyFare
      targets:
        - SkyFareTests
        - SkyFareUITests
    archive:
      config: Release
